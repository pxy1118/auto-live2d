[project]
name = "auto-live2d-latent-experiment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.10.0",
    "transformers==5.22.1",
    "numpy==2.5.4",
    "safetensors==0.8.0",
    "huggingface-hub==1.33.0",
    "matplotlib>=3.10,<4",
    "lm-format-enforcer==0.11.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
